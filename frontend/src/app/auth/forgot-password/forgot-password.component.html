<div class="login">
  <mat-card class="login__card">
    <mat-card-header>
      <mat-card-title>Reset your password</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (submitted()) {
        <p>If an account exists for that email, a reset link has been sent.</p>
      } @else {
        <form [formGroup]="form" (ngSubmit)="submit()" class="login__form">
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" autocomplete="username" />
            @if (form.controls.email.invalid && form.controls.email.touched) {
              <mat-error>A valid email is required.</mat-error>
            }
          </mat-form-field>
          <button mat-raised-button color="primary" type="submit" class="login__submit">Send reset link</button>
        </form>
      }
      <a routerLink="/login" class="login__forgot">Back to sign in</a>
    </mat-card-content>
  </mat-card>
</div>
