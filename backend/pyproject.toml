[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stone-crusher-backend"
version = "0.1.0"
description = "Stone Crusher Management Platform — backend (modular monolith, Phase 0 foundation)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "email-validator>=2.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Only needed in deployed environments (STORAGE_PROVIDER=azure and/or Application Insights
# wired up). Local development and the test suite use the local storage provider and stdout
# logging, so these are kept out of the base install to avoid pulling in a large, slow-to-resolve
# dependency tree for a path most local/dev/test runs never exercise. Install with `pip install
# -e ".[azure]"` before deploying, or rely on the Docker image which installs it explicitly.
azure = [
  "azure-storage-blob>=12.20",
  "azure-identity>=1.16",
  "opencensus-ext-azure>=1.1.13",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "aiosqlite>=0.20",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "factory-boy>=3.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env_files = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
