trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

variables:
  pythonVersion: "3.12"
  nodeVersion: "20.x"
  backendImage: "stone-crusher-backend"
  frontendImage: "stone-crusher-frontend"

stages:
  - stage: Install
    displayName: "Install Dependencies"
    jobs:
      - job: BackendInstall
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - script: |
              cd backend
              python -m pip install --upgrade pip
              pip install -e ".[dev]"
            displayName: "Install backend dependencies"

      - job: FrontendInstall
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
          - script: |
              cd frontend
              npm ci
            displayName: "Install frontend dependencies"

  - stage: Lint
    displayName: "Lint"
    dependsOn: Install
    jobs:
      - job: BackendLint
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - script: |
              cd backend
              pip install -e ".[dev]"
              ruff check app tests
              black --check app tests
            displayName: "Ruff + Black"

      - job: FrontendLint
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
          - script: |
              cd frontend
              npm ci
              npm run lint
            displayName: "ESLint"

  - stage: Test
    displayName: "Tests"
    dependsOn: Lint
    jobs:
      - job: BackendTests
        pool:
          vmImage: "ubuntu-latest"
        services:
          postgres: postgres
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - script: |
              cd backend
              pip install -e ".[dev]"
              pytest --maxfail=1 --disable-warnings --cov=app
            displayName: "Backend tests"
            env:
              DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
              JWT_SECRET_KEY: ci-test-secret-key-not-for-production
              ENVIRONMENT: test

      - job: FrontendTests
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
          - script: |
              cd frontend
              npm ci
              npm test -- --watch=false --browsers=ChromeHeadless
            displayName: "Frontend tests"

  - stage: SecurityChecks
    displayName: "Security Checks"
    dependsOn: Test
    jobs:
      - job: DependencyAudit
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - script: |
              cd backend
              pip install -e ".[dev]"
              pip-audit || true
            displayName: "Python dependency audit"
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
          - script: |
              cd frontend
              npm audit --audit-level=high || true
            displayName: "npm dependency audit"

  - stage: Build
    displayName: "Build"
    dependsOn: SecurityChecks
    jobs:
      - job: BuildArtifacts
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
          - script: |
              cd frontend
              npm ci
              npm run build -- --configuration production
            displayName: "Frontend production build"

  - stage: DockerBuildPush
    displayName: "Docker Build & Push"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildAndPush
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: Docker@2
            displayName: "Build & push backend image"
            inputs:
              containerRegistry: "$(azureContainerRegistryServiceConnection)"
              repository: $(backendImage)
              command: buildAndPush
              Dockerfile: backend/Dockerfile
              buildContext: backend
              tags: |
                $(Build.BuildId)
                latest
          - task: Docker@2
            displayName: "Build & push frontend image"
            inputs:
              containerRegistry: "$(azureContainerRegistryServiceConnection)"
              repository: $(frontendImage)
              command: buildAndPush
              Dockerfile: frontend/Dockerfile
              buildContext: frontend
              tags: |
                $(Build.BuildId)
                latest

  - stage: DeployDevelopment
    displayName: "Deploy to Development"
    dependsOn: DockerBuildPush
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDev
        environment: "development"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploy $(backendImage):$(Build.BuildId) and $(frontendImage):$(Build.BuildId) to Azure Container Apps / App Service (Development)."
                  displayName: "Deploy Development (placeholder — see infrastructure/README.md)"

# Promotion path (manual approvals gate Staging -> Production):
# Development -> Testing -> Staging -> Approval -> Production
# Credentials must come from Azure Key Vault / pipeline variable groups linked to service connections —
# never place secrets directly in this YAML.
